[package]
name = "pagecrop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pagecrop-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
pagecrop-core = { version = "0.4.0", path = "../core" }
pagecrop-testkit = { version = "0.4.0", path = "../testkit" }
