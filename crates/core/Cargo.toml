[package]
name = "pagecrop-core"
version.workspace = true
edition.workspace = true

[lib]
name = "pagecrop_core"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
kamadak-exif = "0.6.1"
natord = "1.0.9"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
filetime = "0.2.29"
pagecrop-testkit = { path = "../testkit" }
tempfile = "3.27.0"
