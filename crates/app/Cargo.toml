[package]
name = "pagecrop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pagecrop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
pagecrop-core = { version = "0.1.0", path = "../core" }
rayon = "1.12.0"
rfd = "0.17.2"
