[package]
name = "pagecrop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Crop, straighten and shrink photos of book pages in bulk"

[[bin]]
name = "pagecrop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
pagecrop-core = { version = "0.3.0", path = "../core" }
rayon = "1.12.0"
rfd = "0.17.2"

# Read by `cargo deb` (see scripts/build-deb.sh).
[package.metadata.deb]
name = "pagecrop"
maintainer = "penCsharpener <26190934+penCsharpener@users.noreply.github.com>"
copyright = "2026 penCsharpener"
license-file = ["../../LICENSE", "0"]
extended-description = """\
pagecrop crops, straightens and shrinks photos of book pages in bulk. An adjustment made on one \
page applies to every following page until the next page that has its own adjustment."""
section = "graphics"
priority = "optional"
# The window libraries are loaded at run time, so `$auto` cannot see them.
depends = "$auto, libxkbcommon-x11-0, libwayland-client0, libegl1"
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/pagecrop", "usr/bin/", "755"],
    ["../../assets/pagecrop.desktop", "usr/share/applications/", "644"],
    ["../../assets/pagecrop.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
]
